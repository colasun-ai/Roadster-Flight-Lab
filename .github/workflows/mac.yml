name: Mac desktop verification
on:
  workflow_dispatch:
    inputs:
      arch:
        description: Mac processor
        type: choice
        options: [arm64, x64]
        default: arm64
      stage_release:
        description: Attach the verified app to the draft for this tag
        required: false
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  verify:
    runs-on: ${{ inputs.arch == 'x64' && 'macos-15-intel' || 'macos-15' }}
    env:
      ROADSTER_MAC_ARCH: ${{ inputs.arch || 'arm64' }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Assemble the Intel CPU runtime
        if: inputs.arch == 'x64'
        run: python3 scripts/fsd/prepare_mac_intel_runtime.py
      - name: Restore the pinned Apple Silicon Python and native libraries
        if: inputs.arch != 'x64'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(uname -m)" = arm64
          name=Roadster-Flight-Lab-0.10.0-Mac-arm64.zip
          gh release download v0.10.0 --pattern "$name" --dir "$RUNNER_TEMP"
          cd "$RUNNER_TEMP"
          echo "e985aa486e9a5383fcfa1fb830d111f0e886d937e6dba97cef0f6604491303de  $name" | shasum -a 256 -c -
          ditto -x -k "$name" previous
          runtime="previous/Roadster Flight Lab.app/Contents/Resources/fsd-runtime"
          cmp "$runtime/runtime-manifest.json" "$GITHUB_WORKSPACE/fsd-runtime/runtime-manifest.json"
          for dir in python site-packages; do
            mv "$runtime/$dir" "$GITHUB_WORKSPACE/fsd-runtime/"
          done
      - name: Build and verify the signed application
        run: |
          npm ci
          node tests/languages.test.js
          npm run pack:mac
          app=$(node -p "require('./desktop-build/mac-build-path.json').app")
          codesign --verify --deep --strict "$app"
          node scripts/fsd/smoke_portable.cjs "$app/Contents/Resources/fsd-runtime"
          unzip -tq "desktop-build/"*"-Mac-$ROADSTER_MAC_ARCH.zip"
          archive=$(node -p "require('./desktop-build/mac-build-path.json').archive")
          shasum -a 256 "$archive"
          stat -f 'Zip bytes: %z' "$archive"
          if [[ "$ROADSTER_MAC_ARCH" == "arm64" ]]; then
            python3 scripts/verify-mac-garage.py "$app"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: mac-${{ inputs.arch || 'arm64' }}-archive
          path: desktop-build/*-Mac-${{ inputs.arch || 'arm64' }}.zip
          compression-level: 0
          retention-days: 14
  intel_window:
    if: inputs.arch == 'x64'
    needs: verify
    runs-on: macos-15
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mac-x64-archive
          path: installer
      - name: Open the signed Intel ZIP under Rosetta and exercise the garage and city
        run: |
          test "$(uname -m)" = arm64
          test "$(arch -x86_64 uname -m)" = x86_64
          ditto -x -k installer/*-Mac-x64.zip "$RUNNER_TEMP/game"
          app="$RUNNER_TEMP/game/Roadster Flight Lab.app"
          test "$(lipo -archs "$app/Contents/MacOS/Roadster Flight Lab")" = x86_64
          codesign --verify --deep --strict "$app"
          python3 scripts/verify-mac-garage.py "$app"
  stage:
    if: always() && needs.verify.result == 'success' && (inputs.arch != 'x64' || needs.intel_window.result == 'success') && inputs.stage_release && startsWith(github.ref, 'refs/tags/')
    needs: [verify, intel_window]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mac-${{ inputs.arch || 'arm64' }}-archive
          path: installer
      - name: Attach the tested ZIP to the draft
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          test "$(gh release view "$TAG" --json isDraft --jq .isDraft)" = true
          gh release upload "$TAG" installer/*-Mac-*.zip
