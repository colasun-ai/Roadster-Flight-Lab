<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Model 3 原始几何驾驶节点验证</title>
<style>body{margin:0;background:#0b141e;color:#f0f5fa;font:14px system-ui}canvas{display:block}#panel{position:fixed;left:20px;top:20px;width:290px;padding:18px;border-radius:16px;background:#10202de8;backdrop-filter:blur(15px)}h1{font-size:19px;margin:0 0 8px}small{color:#9bb1c3}label{display:block;margin:12px 0}input{width:100%}button{background:#224760;color:white;border:1px solid #5a849c;padding:7px 12px;margin:4px 3px 0 0;border-radius:7px}pre{font-size:10px;white-space:pre-wrap;max-height:160px;overflow:auto}</style>
<div id="panel"><h1>2018 Model 3 · 几何验证</h1><small>原始 684,315 三角面 · 真实四轮节点</small><label>前轮转向 ±35° <input id="steer" type="range" min="-35" max="35" value="0"></label><label>车轮滚动 <input id="roll" type="range" min="0" max="360" value="0"></label><label>悬挂 -90 ~ +20 mm <input id="suspension" type="range" min="-90" max="20" value="0"></label><button id="animate">连续动画</button><button id="doors">四门</button><button id="hood">前盖</button><button id="trunk">后盖</button><button id="lights">灯光</button><button id="verify">自动验证</button><button id="cockpit">驾驶舱</button><button id="outside">外观</button><pre id="result">加载中…</pre></div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {Model3Visual} from '/src/vehicles/model3/Model3Visual.js';
const scene=new THREE.Scene();scene.background=new THREE.Color('#111e2a');
const camera=new THREE.PerspectiveCamera(37,innerWidth/innerHeight,.03,100);camera.position.set(7,3.1,7.8);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setClearColor(0x111e2a);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.2;renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFShadowMap;document.body.append(renderer.domElement);
const orbit=new OrbitControls(camera,renderer.domElement);orbit.target.set(0,.6,0);orbit.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xe1f3ff,0x8792a0,3));
for(const p of [[3,8,4],[-5,4,-2]]){const l=new THREE.DirectionalLight(0xffffff,3);l.position.set(...p);scene.add(l);if(p[0]>0){l.castShadow=true;l.shadow.mapSize.set(2048,2048);l.shadow.camera.left=-4;l.shadow.camera.right=4;l.shadow.camera.top=4;l.shadow.camera.bottom=-4;l.shadow.bias=-.0002;}}
const floor=new THREE.Mesh(new THREE.PlaneGeometry(100,100),new THREE.MeshStandardMaterial({color:0x2a3942,roughness:.82}));floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const metadata=await fetch('/models/model3-geometry.json').then(r=>r.json());const gltf=await new GLTFLoader().loadAsync('/models/model3-drive-ready.glb');const root=gltf.scene;scene.add(root);root.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;}});let visual=new Model3Visual(root,metadata);
const vehicle={steer:0,wheels:metadata.wheels.map(w=>({...w,angle:0,steer:0,compression:0})),forwardSpeed:()=>0};let moving=false,opened=false,hood=false,trunk=false,lights=false;
const $=id=>document.getElementById(id);let time=0;
$('cockpit').onclick=()=>{camera.fov=metadata.cockpit.fov||68;camera.updateProjectionMatrix();camera.position.set(...metadata.cockpit.position);orbit.target.set(...metadata.cockpit.target);orbit.update()};$('outside').onclick=()=>{camera.fov=37;camera.updateProjectionMatrix();camera.position.set(7,3.1,7.8);orbit.target.set(0,.6,0);orbit.update()};$('animate').onclick=()=>{moving=!moving};$('doors').onclick=()=>{opened=!opened;for(const id of ['door_fl','door_fr','door_rl','door_rr'])visual.setInteraction(id,opened)};$('hood').onclick=()=>{hood=!hood;visual.setInteraction('hood',hood)};$('trunk').onclick=()=>{trunk=!trunk;visual.setInteraction('trunk',trunk)};$('lights').onclick=()=>{lights=!lights;visual.setLights({headlights:lights,brake:lights,reverse:lights,indicator:lights?'hazard':'off'})};
function setState(roll=0,steer=0,compression=0){vehicle.steer=steer;vehicle.wheels.forEach((w,i)=>{w.angle=roll;w.steer=i<2?steer:0;w.compression=compression});visual.update(vehicle,1/60);root.updateMatrixWorld(true)}
function verify(){
 const results=[];const add=(name,pass,detail)=>results.push({name,pass,detail});const originals=new Map();root.traverse(n=>{if(n.material)originals.set(n,n.material)});
 setState();const pivots=metadata.wheels.map(w=>root.getObjectByName(w.rotationNode).getWorldPosition(new THREE.Vector3()).toArray());let maxPivotError=0;
 for(const degrees of [0,45,90,135,180,225,270,315,360]){setState(degrees*Math.PI/180);metadata.wheels.forEach((w,i)=>{const p=root.getObjectByName(w.rotationNode).getWorldPosition(new THREE.Vector3());maxPivotError=Math.max(maxPivotError,p.distanceTo(new THREE.Vector3(...pivots[i])))});}add('360° rolling pivot stability',maxPivotError<1e-10,{maxPivotErrorMeters:maxPivotError});
 const wheel=metadata.wheels[0];const caliper=root.getObjectByName(wheel.caliperNodes[0]);setState();const caliperHome=caliper.matrixWorld.clone();setState(Math.PI*.75);add('caliper does not roll',caliper.matrixWorld.equals(caliperHome));
 let steeringOK=true;for(const angle of [-35,35]){setState(0,angle*Math.PI/180);steeringOK&&=Math.abs(root.getObjectByName('Wheel_FL_Steering').rotation.y-angle*Math.PI/180)<1e-10&&Math.abs(root.getObjectByName('Wheel_FR_Steering').rotation.y-angle*Math.PI/180)<1e-10;}add('front ±35° independent steering',steeringOK);
 setState();const travel=[.020,-.030,-.090,.012];vehicle.wheels.forEach((w,i)=>w.compression=travel[i]);visual.update(vehicle,1/60);add('independent suspension within selected -90/+20 mm range',metadata.wheels.every((w,i)=>Math.abs(root.getObjectByName(w.suspensionNode).position.y-w.center[1]-travel[i])<1e-8));
 setState();visual.dispose();const baseMaterial=new Map();root.traverse(n=>{if(n.material)baseMaterial.set(n,n.material)});let count=0;root.traverse(()=>count++);let reuse=true;
 for(let i=0;i<20;i++){visual=new Model3Visual(root,metadata);for(const id of ['door_fl','door_fr','door_rl','door_rr','hood','trunk'])visual.setInteraction(id,true);visual.setLights({headlights:true,brake:true,reverse:true,indicator:'hazard'});visual.update(vehicle,2);visual.dispose();let c=0;root.traverse(n=>{c++;if(baseMaterial.has(n)&&n.material!==baseMaterial.get(n))reuse=false});if(c!==count)reuse=false;}
 add('20× construct/dispose restores cached materials and nodes',reuse,{nodes:count});
 visual=new Model3Visual(root,metadata);setState();visual.setLights({headlights:true,brake:true,reverse:true,indicator:'hazard'});add('headlights illuminate and brake/reverse/indicator materials respond',visual.headlightBeams.length===2&&visual.headlightBeams.every(l=>l.visible)&&Object.values(visual.lightMeshes).every(meshes=>meshes.every(n=>(Array.isArray(n.material)?n.material:[n.material]).every(m=>m.emissiveIntensity>1))));visual.setLights({headlights:false,brake:false,reverse:false,indicator:'off'});let textureSet=new Set();root.traverse(n=>{for(const m of n.material?Array.isArray(n.material)?n.material:[n.material]:[])for(const k of ['map','normalMap','roughnessMap','metalnessMap','emissiveMap'])if(m[k])textureSet.add(m[k])});add('embedded PNG images decoded',textureSet.size>=22,{textures:textureSet.size});
 window.model3Verification={ready:true,pass:results.every(r=>r.pass),results,renderer:renderer.info,metadataOutput:metadata.output};$('result').textContent=JSON.stringify(window.model3Verification,null,2);moving=false;return window.model3Verification;
}
$('verify').onclick=verify;window.assetReady=true;window.model3Asset={root,metadata,vehicle,verify,setState,visual};$('result').textContent='资源已加载，拖动以检查车轮与车门。';
let frameTime=performance.now();function animate(){requestAnimationFrame(animate);const now=performance.now(),dt=Math.min((now-frameTime)/1000,.05);frameTime=now;time+=dt;if(moving){vehicle.steer=Math.sin(time*.6)*.61;vehicle.wheels.forEach((w,i)=>{w.angle=time*4;w.steer=i<2?vehicle.steer:0;w.compression=Math.sin(time*2+i)*.018})}else{vehicle.steer=+$('steer').value*Math.PI/180;vehicle.wheels.forEach((w,i)=>{w.angle=+$('roll').value*Math.PI/180;w.steer=i<2?vehicle.steer:0;w.compression=+$('suspension').value/1000})}visual.update(vehicle,dt);orbit.update();renderer.render(scene,camera)}animate();window.addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)})
</script></html>
